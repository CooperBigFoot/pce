[workspace]
members = ["crates/*"]

[package]
name = "pce"
version = "0.1.16"
edition = "2024"

[dependencies]
pce-core = { path = "crates/core" }
anyhow = "1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
jsonschema = { version = "0.49", default-features = false }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

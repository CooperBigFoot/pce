[workspace]
members = ["crates/*"]

# AGENTS.md section 1 states these bans as doctrine; this table is what makes
# clippy actually enforce them. Library crates opt in via `[lints] workspace = true`.
# The root binary deliberately does not: src/main.rs is the composition root and
# may print to stdout and use `.expect("reason")` for unrecoverable setup.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"

[package]
name = "pce"
version = "0.1.16"
edition = "2024"

[dependencies]
pce-core = { path = "crates/core" }
anyhow = "1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
jsonschema = { version = "0.49", default-features = false }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
